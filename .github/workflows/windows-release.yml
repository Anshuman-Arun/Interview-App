name: Publish Windows release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: release Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout exact tag event object
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact tagged source
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          $eventCommit = (git rev-parse "$($env:GITHUB_SHA)^{commit}").Trim()
          $tagCommit = (git rev-parse "$($env:RELEASE_TAG)^{commit}").Trim()
          if ($head -ne $eventCommit) {
            throw "Checked-out commit $head does not match immutable tag-event commit $eventCommit"
          }
          if ($tagCommit -ne $eventCommit) {
            throw "Tag $env:RELEASE_TAG no longer resolves to immutable tag-event commit $eventCommit"
          }
          "SOURCE_SHA=$eventCommit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_VERSION=$($env:RELEASE_TAG.Substring(1))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install pnpm 11.19.0
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Validate tag and canonical version
        run: node scripts/check-release-version.mjs --tag "${{ github.ref_name }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python 3.13 for validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pinned local model runtime wheels
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: -r workers/python/requirements-local-model-runtime.txt"

      - name: Validate local runtime source without model weights
        shell: pwsh
        run: |
          python -I workers/python/validate_local_model_runtime.py
          python -I workers/python/test_local_model_worker.py
          python -I workers/python/test_local_vision_runtime.py

      - name: Run authoritative release validation
        run: pnpm check

      - name: Build synthetic prior-version installer
        shell: pwsh
        run: |
          $backup = Join-Path $env:RUNNER_TEMP "package-release-current.json"
          Copy-Item "package.json" $backup -Force
          try {
            $package = Get-Content -Raw "package.json" | ConvertFrom-Json
            $parts = $env:RELEASE_VERSION.Split(".")
            $major = [int]$parts[0]
            $minor = [int]$parts[1]
            $patch = [int]$parts[2]
            if ($patch -gt 0) {
              $priorVersion = "$major.$minor.$($patch - 1)"
            } elseif ($minor -gt 0) {
              $priorVersion = "$major.$($minor - 1).0"
            } elseif ($major -gt 0) {
              $priorVersion = "$($major - 1).0.0"
            } else {
              throw "Version 0.0.0 has no lower synthetic prior version for upgrade validation"
            }
            $package.version = $priorVersion
            $package | ConvertTo-Json -Depth 100 | Set-Content -Encoding utf8NoBOM "package.json"
            pnpm dist:win
            $prior = "dist/windows/InterviewApp-Setup-$priorVersion.exe"
            if (-not (Test-Path $prior)) { throw "Synthetic prior installer is missing: $prior" }
            Copy-Item $prior (Join-Path $env:RUNNER_TEMP "InterviewApp-Prior.exe") -Force
          } finally {
            Copy-Item $backup "package.json" -Force
          }

      - name: Build exact release installer
        run: pnpm dist:win

      - name: Assert exact release artifact and unsigned status
        shell: pwsh
        run: |
          $expected = "dist/windows/InterviewApp-Setup-$env:RELEASE_VERSION.exe"
          if (-not (Test-Path $expected)) { throw "Expected release installer is missing: $expected" }
          $installers = @(Get-ChildItem "dist/windows/InterviewApp-Setup-*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Release build produced $($installers.Count) installer candidates instead of exactly one"
          }
          $resolvedExpected = (Resolve-Path $expected).Path
          if ($installers[0].FullName -ne $resolvedExpected) {
            throw "Release installer candidate does not match the canonical versioned filename"
          }
          $signature = Get-AuthenticodeSignature $resolvedExpected
          if ($signature.Status -ne "NotSigned") {
            throw "Expected unsigned v0.1-era installer, got Authenticode status $($signature.Status)"
          }
          "INSTALLER_PATH=$expected" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run packaged executable smoke
        shell: pwsh
        run: ./scripts/run-packaged-desktop-smoke.ps1

      - name: Run installer upgrade and persistence smoke
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1 -Installer "$env:INSTALLER_PATH" -PriorInstaller "$env:RUNNER_TEMP\InterviewApp-Prior.exe"

      - name: Generate and verify SHA-256
        shell: pwsh
        run: |
          $checksum = "$env:INSTALLER_PATH.sha256"
          node scripts/create-release-checksum.mjs --file "$env:INSTALLER_PATH" --output "$checksum"
          node scripts/create-release-checksum.mjs --file "$env:INSTALLER_PATH" --verify "$checksum"
          "CHECKSUM_PATH=$checksum" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Render release notes with provenance
        shell: pwsh
        run: |
          $checksumLine = (Get-Content -Raw $env:CHECKSUM_PATH).Trim()
          $checksum = ($checksumLine -split "\s+", 2)[0]
          if ($checksum -notmatch "^[0-9a-f]{64}$") { throw "Rendered checksum is malformed" }
          $workflowUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $notes = Get-Content -Raw ".github/RELEASE_TEMPLATE.md"
          $notes = $notes.Replace("{{VERSION}}", $env:RELEASE_VERSION)
          $notes = $notes.Replace("{{SOURCE_SHA}}", $env:SOURCE_SHA)
          $notes = $notes.Replace("{{WORKFLOW_URL}}", $workflowUrl)
          $notes = $notes.Replace("{{CHECKSUM}}", $checksum)
          $notesPath = Join-Path $env:RUNNER_TEMP "InterviewApp-Release-Notes.md"
          $notes | Set-Content -Encoding utf8NoBOM $notesPath
          "RELEASE_NOTES_PATH=$notesPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload exact release build to this workflow run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: InterviewApp-Windows-release-${{ github.ref_name }}
          path: |
            ${{ env.INSTALLER_PATH }}
            ${{ env.CHECKSUM_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Create draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" "$env:INSTALLER_PATH" "$env:CHECKSUM_PATH" `
            --repo "$env:GITHUB_REPOSITORY" `
            --verify-tag `
            --target "$env:SOURCE_SHA" `
            --draft `
            --title "Interview App $env:RELEASE_TAG" `
            --notes-file "$env:RELEASE_NOTES_PATH"
