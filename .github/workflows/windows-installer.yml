name: Build Windows installer

on:
  pull_request:
    paths:
      - ".gitattributes"
      - ".github/workflows/windows-installer.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "electron-builder.yml"
      - "tsconfig.json"
      - "apps/desktop/**"
      - "apps/web/**"
      - "apps/server/**"
      - "packages/**"
      - "workers/python/local_model_worker.py"
      - "workers/python/requirements-local-model-runtime.txt"
      - "scripts/check-packaged-desktop.mjs"
      - "scripts/check-public-release.mjs"
      - "scripts/run-packaged-desktop-smoke.ps1"
      - "scripts/test-windows-installer.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm 11.19.0
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate packaging contract
        run: pnpm test:package:win

      - name: Build unsigned NSIS installer
        run: pnpm dist:win

      - name: Run packaged executable smoke
        shell: pwsh
        run: ./scripts/run-packaged-desktop-smoke.ps1

      - name: Run installer persistence smoke
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1

      - name: Upload unsigned installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: InterviewApp-Windows-unsigned-${{ github.sha }}
          path: dist/windows/InterviewApp-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
