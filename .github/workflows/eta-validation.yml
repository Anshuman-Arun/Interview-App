name: Eta branch validation

on:
  push:
    branches:
      - feature/formal-interpretation-routing

permissions:
  contents: read

jobs:
  eta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      INTERVIEW_CI_PROVIDER_MODE: mock-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - name: Architecture boundaries
        run: node scripts/check-architecture-boundaries.mjs
      - name: Public release hygiene
        run: pnpm security:public
      - name: Eta lint
        if: always()
        run: >
          pnpm exec eslint
          packages/domain/src/formal-interpretation.ts
          packages/interview-engine/src/formal-interpretation.ts
          packages/interview-engine/src/formal-protocol-routing.ts
          packages/interview-engine/src/interpretation-coordinator.ts
          packages/interview-engine/src/verification-coordinator.ts
          packages/verification/src/structured-statement-validation.ts
          packages/verification/src/verifier-common.ts
          tests/formal-interpretation-routing.test.ts
          tests/formal-interpretation-routing.property.test.ts
      - name: Eta focused tests
        if: always()
        run: pnpm exec vitest run tests/formal-interpretation-routing.test.ts tests/formal-interpretation-routing.property.test.ts tests/formal-interpretation-admission.test.ts tests/verification-admission.test.ts tests/verification-contract-hardening.test.ts tests/deterministic-math-invariants.test.ts
      - name: Full Vitest
        if: always()
        run: pnpm test
      - name: Browser build
        if: always()
        run: pnpm build:web
      - name: Replay tests
        if: always()
        run: pnpm test:replay
      - name: Property suite
        if: always()
        run: pnpm test:property
      - name: Typed E2E
        if: always()
        run: pnpm test:e2e
      - name: Synthetic demo
        if: always()
        run: pnpm demo
