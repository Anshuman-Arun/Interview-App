name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # First-attempt PR runs share a ref-scoped group so a newer head can
  # supersede an older one. Main pushes and reruns are SHA/attempt-scoped,
  # preventing a new queued run from replacing unrelated pending validation.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.ref || github.sha }}-${{ github.run_attempt }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      CI: true
      INTERVIEW_CI_PROVIDER_MODE: mock-only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm 11.19.0
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pinned local model runtime wheels
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: -r workers/python/requirements-local-model-runtime.txt"

      - name: Validate local model runtime API surface
        run: python -I workers/python/validate_local_model_runtime.py

      - name: Test production Python worker without model weights
        run: python -I workers/python/test_local_model_worker.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frozen architecture boundaries
        run: node scripts/check-architecture-boundaries.mjs

      - name: Check public-release hygiene
        run: pnpm security:public

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build browser application
        run: pnpm build:web

      - name: Build Electron desktop runtime
        run: pnpm build:desktop

      - name: Run Electron desktop bootstrap tests
        run: pnpm test:desktop

      - name: Run complete Vitest suite
        # The CI variant keeps full discovery while bounding file-level
        # parallelism for GitHub-hosted Windows runner stability.
        run: pnpm test:ci

      # These focused gates intentionally rerun high-risk slices. Besides
      # focused failure signal, they keep the named package-script contracts
      # themselves from silently drifting while the full-suite glob stays green.
      - name: Run replay verification
        run: pnpm test:replay

      - name: Run property test suite
        run: pnpm test:property

      - name: Run end-to-end typed interview suite
        run: pnpm test:e2e

      - name: Run end-to-end voice interview suite
        run: pnpm test:e2e:voice

      - name: Run synthetic interview demo
        run: pnpm demo


  python-runtime-compat:
    name: python runtime compat (${{ matrix.os }}, 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact local model runtime lock
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: -r workers/python/requirements-local-model-runtime.txt"

      - name: Validate pinned runtime and worker source
        run: |
          python -I workers/python/validate_local_model_runtime.py
          python -I -m py_compile workers/python/local_model_worker.py
          python -I workers/python/test_local_model_worker.py

  package-windows:
    name: package Windows installer
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm 11.19.0
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate packaging contract
        run: pnpm test:package:win

      - name: Build unsigned NSIS installer
        run: pnpm dist:win

      - name: Run packaged executable smoke
        shell: pwsh
        run: ./scripts/run-packaged-desktop-smoke.ps1

      - name: Run installer persistence smoke
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1

      - name: Upload validated unsigned installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: InterviewApp-Windows-unsigned-${{ github.sha }}
          path: dist/windows/InterviewApp-Setup-*.exe
          if-no-files-found: error
          retention-days: 3
