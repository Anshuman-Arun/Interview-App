name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # PR runs share a ref-scoped group so a newer head can supersede an older
  # head. Main-push runs use the commit SHA so workflow concurrency never
  # supersedes one main-push validation run with another.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      CI: true
      INTERVIEW_CI_PROVIDER_MODE: mock-only
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pnpm 11.19.0
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frozen architecture boundaries
        run: node scripts/check-architecture-boundaries.mjs

      - name: Check public-release hygiene
        run: pnpm security:public

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build browser application
        run: pnpm build:web

      - name: Build Electron desktop runtime
        run: pnpm build:desktop

      - name: Run Electron desktop bootstrap tests
        run: pnpm test:desktop

      - name: Run complete Vitest suite
        # The CI variant keeps full discovery while bounding file-level
        # parallelism for GitHub-hosted Windows runner stability.
        run: pnpm test:ci

      # These focused gates intentionally rerun high-risk slices. Besides
      # focused failure signal, they keep the named package-script contracts
      # themselves from silently drifting while the full-suite glob stays green.
      - name: Run replay verification
        run: pnpm test:replay

      - name: Run property test suite
        run: pnpm test:property

      - name: Run end-to-end typed interview suite
        run: pnpm test:e2e

      - name: Run synthetic interview demo
        run: pnpm demo
