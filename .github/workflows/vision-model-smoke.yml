name: Vision model smoke (Windows)

on:
  pull_request:
    paths:
      - ".github/workflows/vision-model-smoke.yml"
      - "apps/desktop/src/runtime/local-vision-backend.ts"
      - "apps/desktop/src/runtime/composition.ts"
      - "apps/desktop/src/runtime/model-assets.ts"
      - "workers/python/local_model_worker.py"
      - "workers/python/local_vision_runtime.py"
      - "workers/python/smoke_local_vision_runtime.py"
      - "workers/python/test_local_vision_runtime.py"
      - "workers/python/requirements-local-model-runtime.txt"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: vision-model-smoke-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Check current PR head
        id: current_head
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $current = gh api "repos/${{ github.repository }}/pulls/$env:PR_NUMBER" --jq ".head.sha"
          $isCurrent = if ($current -eq $env:EXPECTED_SHA) { "true" } else { "false" }
          "current=$isCurrent" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Checkout
        if: github.event_name != 'pull_request' || steps.current_head.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        if: github.event_name != 'pull_request' || steps.current_head.outputs.current == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install exact local model runtime lock
        if: github.event_name != 'pull_request' || steps.current_head.outputs.current == 'true'
        run: python -m pip install --disable-pip-version-check --only-binary=:all: -r workers/python/requirements-local-model-runtime.txt

      - name: Validate pinned runtime and no-weight vision safety
        if: github.event_name != 'pull_request' || steps.current_head.outputs.current == 'true'
        run: |
          python -I workers/python/validate_local_model_runtime.py
          python -I workers/python/test_local_vision_runtime.py

      - name: Run exact pinned model against upstream canonical fixtures
        if: github.event_name != 'pull_request' || steps.current_head.outputs.current == 'true'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "vision-model-smoke"
          $report = Join-Path $env:GITHUB_WORKSPACE "vision-smoke-report.json"
          python -I workers/python/smoke_local_vision_runtime.py --work-root "$work" --report "$report"

      - name: Upload vision smoke report
        if: always() && (github.event_name != 'pull_request' || steps.current_head.outputs.current == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vision-model-smoke-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: vision-smoke-report.json
          if-no-files-found: ignore
          retention-days: 14
